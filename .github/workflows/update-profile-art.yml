name: Update Profile Art

on:
  schedule:
    - cron: "17 18 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-profile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Fetch contribution data
        env:
          GH_PROFILE_USER: saathvikmedavarapu2111-a11y
        run: |
          python scripts/fetch_contributions.py

      - name: Render contribution heatmap
        env:
          GH_TERMINAL_USER: saathvik
        run: |
          python scripts/render_heatmap_svg.py

      - name: Commit updated profile art
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/contributions.json contrib-heatmap.svg

          git diff --cached --quiet || \
            git commit -m "chore: update contribution heatmap [skip ci]"

          git push
